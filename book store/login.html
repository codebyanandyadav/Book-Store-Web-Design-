<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Book Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1565c0, #90caf9);
            min-height: 100vh;
            color: #333;
        }

        /* ---------- HEADER (same as home page) ---------- */
        header {
            position: relative;
            background-color: lightblue;
            text-align: center;
            padding: 20px 10px;
            border-bottom: 3px solid #1565c0;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 90px;
            height: auto;
        }

        header h1 {
            color: #0d47a1;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            display: inline-block;
            margin: 0 12px;
            padding: 8px 16px;
            color: #fff;
            background-color: #1565c0;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #0d47a1;
        }

        /* ---------- LOGIN BOX (Experiment 2) ---------- */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .login-box {
            background-color: yellow;
            width: 340px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .login-box h2 {
            color: #0d47a1;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .login-box label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-box input[type="text"]:focus,
        .login-box input[type="password"]:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21, 101, 192, 0.5);
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-row input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: background-color 0.3s;
        }

        .btn-submit {
            background-color: #2e7d32;
        }

        .btn-submit:hover {
            background-color: #1b5e20;
        }

        .btn-reset {
            background-color: #c62828;
        }

        .btn-reset:hover {
            background-color: #8e0000;
        }

        .register-link {
            margin-top: 18px;
            font-size: 14px;
        }

        .register-link a {
            color: #1565c0;
            font-weight: bold;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background-color: #1565c0;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .logo { width: 60px; }
            header h1 { font-size: 1.5em; }
            nav a { margin: 5px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <img src="logo.png" alt="GL Bajaj Logo" class="logo">
        <h1>ONLINE BOOK STORE</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <!-- LOGIN FORM -->
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Login</h2>

            <form action="#" method="post">
                <label for="username">User name:</label>
                <input type="text" id="username" name="username" placeholder="Enter your user name">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">

                <div class="btn-row">
                    <input type="submit" value="Submit" class="btn-submit">
                    <input type="reset" value="Reset" class="btn-reset">
                </div>
            </form>

            <p class="register-link">
                New User <a href="registration.html">Register</a>
            </p>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Developed by Anand Yadav | Roll No. 2501920110070</p>
    </footer>

</body>
</html>
